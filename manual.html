<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>חלוקה עם float – רווחים אנכיים</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
    }

    .left-panel {
      float: left;
      width: 20%;
      height: 100vh;
      background-color: white;
      border: 4px solid red;
      margin-right: 10px;
    }

    .right-wrapper {
      float: left;
      width: calc(80% - 10px);
      height: 100vh;
      padding: 10px;
      border: 4px solid red;
      background-color: white;
    }

    /* נגדיר שכל שורה תתפוס כ-31% גובה (מתוך 100%) ונשאיר רווח של 1% בין כל שורה */
    .row {
      width: 100%;
      clear: both;
      margin-bottom: 1%;
    }

    .row:last-child {
      margin-bottom: 0;
    }

    .row-1 .box {
      float: left;
      width: 23.5%;
      margin-right: 2%;
      height: 98%;
      background-color: white;
      border: 4px solid red;
    }

    .row-1 .box:last-child {
      margin-right: 0;
    }

    .row-2-left,
    .row-2-right {
      float: left;
      height: 98%;
    }

    .row-2-left {
      width: 48%;
      margin-right: 4%;
    }

    .row-2-left .box {
      width: 100%;
      height: calc(50% - 5px);
      margin-bottom: 10px;
      background-color: white;
      border: 4px solid red;
    }

    .row-2-left .box:last-child {
      margin-bottom: 0;
    }

    .row-2-right {
      width: 48%;
      background-color: white;
      border: 4px solid red;
    }

    .row-3 .wide,
    .row-3 .narrow {
      float: left;
      height: 98%;
      background-color: white;
      border: 4px solid red;
    }

    .row-3 .wide {
      width: 66%;
      margin-right: 4%;
    }

    .row-3 .narrow {
      width: 30%;
    }

    /* גובה כל שורה מחושב כך ש-3 שורות + 2 רווחים של 1% = 100% */
    .row-1,
    .row-2,
    .row-3 {
      height: 32.66%; /* 100% - 2% מרווחים אנכיים / 3 */
    }

@media screen and (max-width: 750px) {

    /* כל ה"עמודות" של הגריד הופכות לשורה מלאה אחת מתחת לשנייה */
    [class*="col-"] {
        float: none;
        width: 100%;
        margin: 0 0 10px 0;  /* רווח קטן בין המלבנים */
    }

    /* כמו left-panel / right-wrapper בדוגמה – שני הפאנלים אחד מעל השני */
    .leftSide,
    .rightSide,
    .topSide {
        float: none;
        width: 100%;
        height: auto;
        margin: 0 0 10px 0;
    }

    /* כל המלבנים הפנימיים הופכים לרוחב מלא, אחד מתחת לשני */
    .smallCol,
    .biglCol,
    .biglColNoColor,
    .LeftBottomBigCol,
    .RightBottomBigCol,
    .halfCol {
        float: none;
        width: 100%;
        margin: 0 0 10px 0;
        height: 100px;  /* כמו .box / .wide / .narrow בדוגמה */
    }

    /* הקונטיינר החיצוני מתכוונן לגובה התוכן */
    .main-wrapper {
        height: auto;
        padding: 5px;
        overflow: hidden; /* שימור ניקוי float אם נשאר משהו */
    }

    body, html {
        height: auto;
    }
}


</body>
</html>
